name: Stack
description: Stack is a spatial web browser that organizes the web as cards on a canvas
  rather than rows of tabs, built for keyboard-first, distraction-free browsing. Features
  include Fly Mode for fast navigation, multiple user profiles, customizable visual
  themes called realms, Chrome extension support, and privacy-focused browsing without
  ads or trackers, with multiplayer collaboration planned. Stack is a consumer desktop
  application and does not currently publish a public API, developer platform, or SDK.
  Backed by 500 Global and community-funded via WeFunder.
